<title>Wanderer above the Sea of Fog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL canvas; quiet slate UI panels float at the edges like labels on a gallery wall. */
:root{
  --ink:#e9e6dd;          /* pale fog white for text */
  --ink-dim:#b9b8b2;
  --slate:rgba(28,33,36,.62);   /* frock-coat green-black panel */
  --slate-solid:#1c2124;
  --edge:rgba(233,230,221,.18);
  --accent:#c9a36b;       /* wind-blown hair / sunlit rock */
  --fog:#cfd2d8;
  --font-display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-ui:"Cormorant Garamond", Georgia, serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:#cdd0d4;color:var(--ink);overflow:hidden;font-family:var(--font-ui);-webkit-user-select:none;user-select:none;touch-action:none;}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#cdd0d4;}
.bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5;}
.tools{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto;max-width:min(760px,100%);}
.brand{font-family:var(--font-display);font-style:italic;font-weight:500;font-size:19px;letter-spacing:.01em;padding:6px 12px;background:var(--slate);border:1px solid var(--edge);border-radius:4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap;}
.btn,select.btn{font-family:var(--font-mono);font-size:12px;color:var(--ink);background:var(--slate);border:1px solid var(--edge);border-radius:4px;padding:7px 10px;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.btn:hover{border-color:rgba(233,230,221,.45);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.btn[aria-pressed="true"]{background:rgba(201,163,107,.28);border-color:var(--accent);}
select.btn{appearance:none;-webkit-appearance:none;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat;}
select.btn option{background:var(--slate-solid);}
.count{pointer-events:auto;font-family:var(--font-display);font-size:18px;padding:6px 14px;background:var(--slate);border:1px solid var(--edge);border-radius:4px;white-space:nowrap;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.count b{font-family:var(--font-mono);font-weight:500;font-size:15px;color:var(--accent);}
#hud{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-family:var(--font-mono);font-size:11.5px;line-height:1.55;padding:8px 11px;background:var(--slate);border:1px solid var(--edge);border-radius:4px;z-index:5;font-variant-numeric:tabular-nums;white-space:pre;pointer-events:none;}
#help{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-family:var(--font-mono);font-size:11px;color:var(--ink);opacity:.8;text-align:right;line-height:1.6;z-index:4;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6);}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:#cfd2d6;z-index:20;transition:opacity .9s ease;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#loader.gone{opacity:0;pointer-events:none;}
.ld{width:min(420px,100%);text-align:center;color:#2b3135;}
.ld h1{font-family:var(--font-display);font-weight:500;font-style:italic;font-size:clamp(26px,6vw,38px);margin:0 0 6px;text-wrap:balance;}
.ld p{font-family:var(--font-display);font-size:16px;margin:0 0 18px;color:#4a5257;}
.track{height:3px;background:rgba(43,49,53,.18);border-radius:2px;overflow:hidden;}
.fill{height:100%;width:0;background:#2b3135;transition:width .2s linear;}
#ldtxt{font-family:var(--font-mono);font-size:11px;margin-top:10px;color:#4a5257;font-variant-numeric:tabular-nums;}
#strip{position:fixed;left:0;right:0;top:0;height:2px;z-index:6;pointer-events:none;}
#strip .fill{background:var(--accent);}
#err{position:fixed;inset:auto 16px 16px 16px;z-index:30;font-family:var(--font-mono);font-size:12px;background:#3a2222;color:#f4dede;padding:10px 12px;border-radius:4px;}
.touch{display:none;}
body.is-touch .touch{display:block;}
body.is-touch #help{display:none;}
#joy{position:fixed;left:calc(max(16px,env(safe-area-inset-left,0px)) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);width:128px;height:128px;border-radius:50%;background:rgba(28,33,36,.35);border:1px solid var(--edge);z-index:6;touch-action:none;}
#knob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:rgba(233,230,221,.55);border:1px solid rgba(255,255,255,.5);}
.tbtns{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 74px);flex-direction:column;gap:12px;z-index:6;}
body.is-touch .tbtns{display:flex;}
.tb{width:72px;height:72px;border-radius:50%;font-family:var(--font-mono);font-size:12px;color:var(--ink);background:rgba(28,33,36,.55);border:1px solid var(--edge);touch-action:none;}
.tb:active{background:rgba(201,163,107,.45);}
body.is-touch #hud{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 104px);font-size:10px;}
body.is-touch .brand{display:none;}
@media (max-width:640px){ .brand{display:none;} .btn,select.btn{font-size:11px;padding:6px 8px;} .count{font-size:15px;padding:5px 10px;} }
@media (prefers-reduced-motion:reduce){ #loader{transition:none;} }
</style>

<canvas id="c" aria-label="Real-time painted 3D scene of a wanderer standing on a rocky crag above a sea of fog"></canvas>
<div id="strip"><div class="fill" id="stripFill"></div></div>
<div class="bar">
  <div class="tools">
    <span class="brand">Wanderer above the Sea of Fog</span>
    <select class="btn" id="tierSel" aria-label="Quality tier">
      <option value="ultra">Ultra</option><option value="high">High</option><option value="medium">Medium</option><option value="mobile">Mobile</option>
    </select>
    <button class="btn" id="bTour" aria-pressed="false">Tour (T)</button>
    <button class="btn" id="bPhoto" aria-pressed="false">Photo (P)</button>
    <button class="btn" id="bAuto" aria-pressed="true">Auto (R)</button>
    <button class="btn" id="bSound" aria-pressed="false">Sound off</button>
    <button class="btn" id="bHud" aria-pressed="true">HUD (H)</button>
  </div>
  <div class="count" id="count">Vistas <b id="vistaN">0</b> / <b id="vistaT">6</b></div>
</div>
<div id="hud">starting…</div>
<div id="help">WASD walk · Shift hurry · Space hop · F gaze<br>drag look · wheel zoom · T tour · P photo · H HUD</div>
<div class="touch" id="joy"><div id="knob"></div></div>
<div class="touch tbtns"><button class="tb" id="tJump">Hop</button><button class="tb" id="tGaze">Gaze</button></div>
<div id="loader"><div class="ld"><h1>Wanderer above the Sea of Fog</h1><p>after Caspar David Friedrich, 1818</p><div class="track"><div class="fill" id="ldFill"></div></div><div id="ldtxt">preparing the canvas…</div></div></div>
<div id="err" hidden></div>

<!-- ======================= SHARED SCENE CODE (main thread + workers) ======================= -->
<script id="shared">
"use strict";
var SEED = 7;
function setSeed(s){ SEED = s|0; }
function ihash(x){ x|=0; x=Math.imul(x^(x>>>16),0x7feb352d); x=Math.imul(x^(x>>>15),0x846ca68b); return (x^(x>>>16))>>>0; }
function h2(i,j){ return ihash(Math.imul(i,374761393) + Math.imul(j,668265263) + Math.imul(SEED,1442695041))/4294967296; }
function rng(seed){ var a=seed>>>0; return function(){ a=(a+0x6D2B79F5)|0; var t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function smooth(e0,e1,x){ var t=(x-e0)/(e1-e0); t=t<0?0:t>1?1:t; return t*t*(3-2*t); }
function clamp(x,a,b){ return x<a?a:x>b?b:x; }
function mix(a,b,t){ return a+(b-a)*t; }
function vnoise(x,z){ var xi=Math.floor(x), zi=Math.floor(z), xf=x-xi, zf=z-zi; var u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);
  var a=h2(xi,zi), b=h2(xi+1,zi), c=h2(xi,zi+1), d=h2(xi+1,zi+1); return (a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v)*2-1; }
function fbm(x,z,o){ var s=0,a=0.5,f=1; for(var i=0;i<o;i++){ s+=a*vnoise(x*f+i*17.31,z*f-i*9.17); f*=2.03; a*=0.5; } return s; }
function ridged(x,z,o){ var s=0,a=0.5,f=1; for(var i=0;i<o;i++){ s+=a*(1-Math.abs(vnoise(x*f-i*5.3,z*f+i*11.9))); f*=2.07; a*=0.5; } return s; }

/* ---- world layout ---- */
var PLAT = {x:0, z:14};          // summit plateau centre
var CRAG = {x:0, z:-22};         // the painting's crag
var FOG_BASE = 1.6;
// sandstone towers piercing the fog: x, z, radius, top height, has pines
var PILLARS = [
 [-110,-140,20,22,1],[-62,-232,13,16,0],[-205,-82,28,18,1],[-160,-262,16,27,0],[132,-150,30,15,1],[205,-305,24,20,0],
 [72,-385,16,12,1],[-282,-422,38,30,1],[322,-562,46,34,0],[-452,-722,55,32,1],[522,-902,60,28,1],[-122,-702,30,18,0],
 [42,-1002,40,22,1],[262,-82,26,14,1],[-300,62,30,18,0],[300,162,35,16,1],[-62,242,25,12,1],[152,322,30,20,0],
 [-520,-260,44,24,1],[560,-330,40,19,0]
];
var SUN = (function(){ var x=-0.42,y=0.36,z=-0.83, l=Math.hypot(x,y,z); return [x/l,y/l,z/l]; })();

function fogTop(x,z){ return FOG_BASE + 3.0*fbm(x*0.006+3.1,z*0.006-1.7,3) + 3.2*Math.pow(Math.abs(vnoise(x*0.022,z*0.03)),0.7) + 1.2*Math.abs(vnoise(x*0.08,z*0.08)); }

function terrainH(x,z){
  var dx=x-PLAT.x, dz=z-PLAT.z, r=Math.sqrt(dx*dx+dz*dz);
  var h=-70;
  if(r<110){
    var wob=fbm(x*0.025,z*0.025,3)*12;
    var e=smooth(48,72,r+wob);
    var plateau=(6.6-0.0009*r*r);
    var rough=(ridged(x*0.07,z*0.07,3)-0.5)*3.0 + fbm(x*0.3,z*0.3,2)*0.45;
    h=(plateau+rough)*(1-e) + (-70)*e;
    var cx=x-CRAG.x, cz=z-CRAG.z, cd2=cx*cx+cz*cz;
    if(cd2<220) h += 3.3*Math.exp(-cd2/(2*3.1*3.1))*(1+0.28*fbm(x*0.6,z*0.6,2)) + 1.1*Math.exp(-((cx-2.6)*(cx-2.6)+(cz+1.6)*(cz+1.6))/2.2);
  }
  for(var i=0;i<PILLARS.length;i++){
    var p=PILLARS[i], qx=x-p[0], qz=z-p[1], d2=qx*qx+qz*qz, R=p[2]*1.45;
    if(d2>R*R) continue;
    var d=Math.sqrt(d2)*(1+0.22*fbm(x*0.04+p[0]*0.01,z*0.04,2));
    var s=smooth(p[2]*1.12,p[2]*0.78,d);
    var strata=Math.sin((x*0.05+z*0.02)+p[3])*0.0 ;
    var top=p[3]+(ridged(x*0.09,z*0.09,2)-0.5)*4.5 - 0.06*Math.max(0,d-p[2]*0.5)*1.5 + strata;
    h=Math.max(h,-70+(top+70)*s);
  }
  if(z<-500){
    // Rosenberg cone (left)
    var ax=x+700, az=z+1950, ad=Math.sqrt(ax*ax+az*az);
    if(ad<800) h=Math.max(h, 330-0.5*ad + fbm(x*0.01,z*0.01,3)*10);
    // Zirkelstein: dome with a flat-topped tower (right)
    var bx=x-820, bz=z+2150, bd=Math.sqrt(bx*bx+bz*bz);
    if(bd<900){ h=Math.max(h, 85-bd*bd*0.00011 + fbm(x*0.012,z*0.012,2)*6);
      var bdn=bd*(1+0.12*fbm(x*0.05,z*0.05,2)); var ts=smooth(62,40,bdn); if(ts>0) h=Math.max(h, 85+125*ts + (ridged(x*0.04,z*0.04,2)-0.5)*6); }
    // distant ridges and tree lines
    if(z<-1150){ var ramp=smooth(-1150,-1700,z); var rh=25+80*(0.5+0.5*fbm(x*0.0016,z*0.0032+4.0,3)) + 6*fbm(x*0.03,z*0.03,2);
      h=Math.max(h,-70+(rh+70)*ramp); }
  }
  if(z>-500 && (x*x+z*z)>1500*1500*0.0+600*600 && z>200){ // gentle hills behind the plateau so the tour has a back side
    var ramp2=smooth(600,1300,Math.sqrt(x*x+z*z)); if(ramp2>0){ var rh2=10+50*(0.5+0.5*fbm(x*0.002+9.0,z*0.002,3)); h=Math.max(h,-70+(rh2+70)*ramp2); }
  }
  return h;
}
function terrainN(x,z,e){ var hx=(terrainH(x+e,z)-terrainH(x-e,z))/(2*e), hz=(terrainH(x,z+e)-terrainH(x,z-e))/(2*e); var l=Math.sqrt(hx*hx+1+hz*hz); return [-hx/l,1/l,-hz/l,hx,hz]; }

/* ---- trail, obstacles, viewpoints ---- */
var TRAIL_PTS=[[0,-21],[14,-16],[26,-6],[33,10],[32,28],[22,44],[6,50],[-12,47],[-27,36],[-34,18],[-30,0],[-17,-13]];
function catmull(p0,p1,p2,p3,t){ var t2=t*t,t3=t2*t; return 0.5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3); }
var TRAIL=(function(){ var out=[], n=TRAIL_PTS.length, len=0;
  for(var i=0;i<n;i++){ var a=TRAIL_PTS[(i-1+n)%n], b=TRAIL_PTS[i], c=TRAIL_PTS[(i+1)%n], d=TRAIL_PTS[(i+2)%n];
    for(var k=0;k<24;k++){ var t=k/24; out.push([catmull(a[0],b[0],c[0],d[0],t), catmull(a[1],b[1],c[1],d[1],t)]); } }
  var acc=[0]; for(var j=1;j<=out.length;j++){ var p=out[j-1], q=out[j%out.length]; len+=Math.hypot(q[0]-p[0],q[1]-p[1]); acc.push(len); }
  return {pts:out, acc:acc, len:len}; })();
function trailAt(s){ s=((s%TRAIL.len)+TRAIL.len)%TRAIL.len; var a=TRAIL.acc, lo=0, hi=a.length-1; while(hi-lo>1){ var m=(lo+hi)>>1; if(a[m]<=s) lo=m; else hi=m; }
  var p=TRAIL.pts[lo%TRAIL.pts.length], q=TRAIL.pts[(lo+1)%TRAIL.pts.length], t=(s-a[lo])/Math.max(1e-6,a[lo+1]-a[lo]);
  return [mix(p[0],q[0],t), mix(p[1],q[1],t), q[0]-p[0], q[1]-p[1]]; }
function trailNearest(x,z){ var best=1e9, bs=0; for(var i=0;i<TRAIL.pts.length;i++){ var p=TRAIL.pts[i], d=(p[0]-x)*(p[0]-x)+(p[1]-z)*(p[1]-z); if(d<best){best=d; bs=TRAIL.acc[i];} } return [bs, Math.sqrt(best)]; }
var OBSTACLES=(function(){ var o=[], ts=[0.075,0.15,0.225,0.31,0.39,0.465,0.555,0.635,0.715,0.79,0.875,0.945];
  for(var i=0;i<ts.length;i++){ var tp=trailAt(ts[i]*TRAIL.len), l=Math.hypot(tp[2],tp[3])||1, dx=tp[2]/l, dz=tp[3]/l;
    if(i%2===0){ var R=0.55+0.12*((i*7)%3); o.push({type:'boulder', x:tp[0]+(-dz)*0.25, z:tp[1]+dx*0.25, r:R, top:R*1.05}); }
    else { o.push({type:'log', x:tp[0], z:tp[1], ax:-dz, az:dx, half:1.45, r:0.23, top:0.46}); } }
  return o; })();
var VIEWPOINTS=(function(){ var v=[], ts=[0.0,0.17,0.34,0.51,0.67,0.835];
  for(var i=0;i<ts.length;i++){ var tp=trailAt(ts[i]*TRAIL.len); var ox=tp[0]-PLAT.x, oz=tp[1]-PLAT.z, l=Math.hypot(ox,oz)||1;
    v.push({x:tp[0], z:tp[1], s:ts[i]*TRAIL.len, lookX:ox/l, lookZ:oz/l, cairn:i>0, cx:tp[0]+ox/l*1.9, cz:tp[1]+oz/l*1.9}); }
  v[0].lookX=0; v[0].lookZ=-1; return v; })();

function getTrees(){
  var trees=[], R=rng(991+SEED);
  for(var i=0;i<140 && trees.length<26;i++){
    var a=R()*Math.PI*2, r=10+R()*40, x=PLAT.x+Math.cos(a)*r, z=PLAT.z+Math.sin(a)*r;
    if(z<-2 && Math.abs(x)<26) continue;                 // keep the view over the crag open
    if(trailNearest(x,z)[1]<3.2) continue;
    var y=terrainH(x,z); if(y<fogTop(x,z)+1.5) continue;
    var n=terrainN(x,z,0.5); if(n[1]<0.8) continue;
    var h=6+R()*8; trees.push({x:x,y:y,z:z,h:h,r:h*0.27,group:'p'+(a<Math.PI?0:1)+(r<30?0:1)});
  }
  for(var j=0;j<PILLARS.length;j++){ var p=PILLARS[j]; if(!p[4]) continue; var cnt=3+(j%5);
    for(var k=0;k<cnt*3 && cnt>0;k++){ var aa=R()*Math.PI*2, rr=R()*p[2]*0.62, xx=p[0]+Math.cos(aa)*rr, zz=p[1]+Math.sin(aa)*rr, yy=terrainH(xx,zz);
      if(yy<p[3]-6) continue; var hh=7+R()*9; trees.push({x:xx,y:yy,z:zz,h:hh,r:hh*0.26,group:'q'+j}); cnt--; } }
  return trees;
}
</script>

<!-- ======================= WORKER (stroke generation) ======================= -->
<script id="workerSrc" type="text/plain">
"use strict";
var BYTES=36;
var f16buf=new Float32Array(1), u32buf=new Uint32Array(f16buf.buffer);
function toHalf(v){ f16buf[0]=v; var x=u32buf[0], s=(x>>>16)&0x8000, e=((x>>>23)&0xff)-112, m=x&0x7fffff;
  if(e<=0) return s; if(e>30) return s|0x7bff; return s|(e<<10)|(m>>>13); }
function Packer(cap){ this.cap=cap; this.buf=new ArrayBuffer(cap*BYTES); this.f=new Float32Array(this.buf); this.i8=new Int8Array(this.buf); this.u16=new Uint16Array(this.buf); this.u8=new Uint8Array(this.buf); this.n=0; this.gen=new Uint8Array(cap);
  this.mn=[1e9,1e9,1e9]; this.mx=[-1e9,-1e9,-1e9]; }
Packer.prototype.push=function(px,py,pz,nx,ny,nz,tx,ty,tz,len,wid,lit,la,shd,sa,seed,bone,gen,kind){
  if(this.n>=this.cap) return false; var o=this.n*BYTES, fo=o>>2;
  this.f[fo]=px; this.f[fo+1]=py; this.f[fo+2]=pz;
  this.i8[o+12]=Math.round(nx*127); this.i8[o+13]=Math.round(ny*127); this.i8[o+14]=Math.round(nz*127); this.i8[o+15]=0;
  this.i8[o+16]=Math.round(tx*127); this.i8[o+17]=Math.round(ty*127); this.i8[o+18]=Math.round(tz*127); this.i8[o+19]=0;
  this.u16[(o+20)>>1]=toHalf(len); this.u16[(o+22)>>1]=toHalf(wid);
  this.u8[o+24]=clamp(Math.round(lit[0]*255),0,255); this.u8[o+25]=clamp(Math.round(lit[1]*255),0,255); this.u8[o+26]=clamp(Math.round(lit[2]*255),0,255); this.u8[o+27]=clamp(Math.round(la*255),0,255);
  this.u8[o+28]=clamp(Math.round(shd[0]*255),0,255); this.u8[o+29]=clamp(Math.round(shd[1]*255),0,255); this.u8[o+30]=clamp(Math.round(shd[2]*255),0,255); this.u8[o+31]=clamp(Math.round(sa*255),0,255);
  this.u8[o+32]=seed&255; this.u8[o+33]=bone; this.u8[o+34]=gen; this.u8[o+35]=kind;
  this.gen[this.n]=gen; this.n++;
  if(px<this.mn[0])this.mn[0]=px; if(py<this.mn[1])this.mn[1]=py; if(pz<this.mn[2])this.mn[2]=pz;

/* ---------- workers ---------- */
let workers=[], jobQueue=[], jobsTotal=0, jobsDone=0, firstFrameAt=0, loadStart=0, readyResolve, worldGen=0;

const workerURL=URL.createObjectURL(new Blob([$('shared').textContent+'\n'+$('workerSrc').textContent],{type:'text/javascript'}));
function startWorld(tierName){
  worldGen++; const myGen=worldGen;
  for(const w of workers) w.terminate(); workers=[];
  st.tier=tierName; $('tierSel').value=tierName;
  const jobs=planJobs(tierName); jobQueue=jobs.slice(); jobsTotal=jobs.length; jobsDone=0;
  capacity=jobs.reduce((s,j)=>s+j.count+80,0); used=0; chunks=[]; totalStrokes=0;

    w.onmessage=(ev)=>{ if(myGen!==worldGen) return; const m=ev.data, job=pending.get(m.id); pending.delete(m.id);

/* ---------- physics: Rapier with a 4 s timeout, else built-in ---------- */
const phys={kind:'fallback'};
function withTimeout(p,ms){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout '+ms+'ms')),ms))]); }
async function initRapier(){

    const mod=await withTimeout(import('https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.11.2/+esm'),4000);
    const RAPIER=mod.default||mod; await withTimeout(RAPIER.init(),4000);

    const build=(transposed)=>{ const hts=new Float32Array((N+1)*(N+1));

      return world.createCollider(RAPIER.ColliderDesc.heightfield(N,N,hts,{x:size,y:1,z:size}).setTranslation(cx,0,cz)); };
    const probe=()=>{ let worst=0; for(const pt of [[3,-14],[18,30],[-20,10],[0,-21]]){ const ray=new RAPIER.Ray({x:pt[0],y:60,z:pt[1]},{x:0,y:-1,z:0}); const hit=world.castRay(ray,200,true);

let lastDrawn=0;
function frustumPlanes(m){ const p=[]; const r=(a,b,c,d)=>{ const l=Math.hypot(a,b,c); p.push([a/l,b/l,c/l,d/l]); };
  r(m[3]+m[0],m[7]+m[4],m[11]+m[8],m[15]+m[12]); r(m[3]-m[0],m[7]-m[4],m[11]-m[8],m[15]-m[12]);
  r(m[3]+m[1],m[7]+m[5],m[11]+m[9],m[15]+m[13]); r(m[3]-m[1],m[7]-m[5],m[11]-m[9],m[15]-m[13]);
  r(m[3]+m[2],m[7]+m[6],m[11]+m[10],m[15]+m[14]); return p; }
function renderFrame(jitterOn){
  applySize(false);
  const t=TIERS[st.tier]; const w=RT.w, h=RT.h;
  const proj=persp(camState.fov,w/h,0.15,9000), view=viewRot(camState.fwd), vp=mul4(proj,view);
  const focal=h/(2*Math.tan(camState.fov/2));
  let jit=[0,0]; if(jitterOn){ const j=HALTON[st.accN%32]; jit=[j[0]*2/w,j[1]*2/h]; }
  gl.bindFramebuffer(gl.FRAMEBUFFER,RT.msFB); gl.viewport(0,0,w,h);
  gl.clearColor(0.70,0.71,0.74,1); gl.clearDepth(1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.useProgram(SP.p); gl.bindVertexArray(vao); setGlobalUniforms(vp,camState.pos,focal,t,jit);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true); gl.disable(gl.BLEND); gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE); gl.disable(gl.CULL_FACE);
  const planes=frustumPlanes(vp), cam=camState.pos; const vis=[];
  for(const c of chunks){
    let dist=0;
    if(!c.sky && !c.dyn){ const rel=[c.c[0]-cam[0],c.c[1]-cam[1],c.c[2]-cam[2]]; let out=false; for(const pl of planes){ if(pl[0]*rel[0]+pl[1]*rel[1]+pl[2]*rel[2]+pl[3] < -c.r){ out=true; break; } } if(out) continue; dist=Math.max(0,V3.len(rel)-c.r); }
    let k=1; if(!c.sky && !c.dyn){ k=Math.min(1,Math.max(c.genDist,t.lodRef)/Math.max(dist,1e-3)); }
    const cnt=Math.min(c.n,Math.ceil(c.n*Math.min(1,k+0.12))+1); if(cnt<=0) continue;
    vis.push([c,cnt,c.sky?1e9:dist]); }
  vis.sort((a,b)=>a[2]-b[2]);
  let drawn=0;
  for(const [c,cnt] of vis){ gl.uniform1f(SP.U.uGenDist,c.sky?1e6:c.genDist); gl.uniform1f(SP.U.uTotal,c.n); gl.uniform1ui(SP.U.uSeedBase,c.seedBase);
    bindInst(instBuf,c.off); gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,cnt); drawn+=cnt; }
  if(grassN>0){ gl.uniform1f(SP.U.uGenDist,0); gl.uniform1f(SP.U.uTotal,grassN); gl.uniform1ui(SP.U.uSeedBase,991); bindInst(grassBuf,0); gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,grassN); drawn+=grassN; }
  gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE); gl.disable(gl.DEPTH_TEST);
  lastDrawn=drawn;
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,RT.msFB); gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,RT.res.f);
  gl.blitFramebuffer(0,0,w,h,0,0,w,h,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  let src=RT.res.t;
  if(jitterOn){ const a=RT.acc[st.accN%2], b=RT.acc[(st.accN+1)%2];
    gl.bindFramebuffer(gl.FRAMEBUFFER,a.f); gl.viewport(0,0,w,h); gl.useProgram(ACC.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,RT.res.t); gl.uniform1i(ACC.U.uCur,0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,b.t); gl.uniform1i(ACC.U.uPrev,1);
    gl.uniform1f(ACC.U.uW,1/(st.accN+1)); gl.drawArrays(gl.TRIANGLES,0,3); src=a.t; st.accN++; st.lastAcc=a; }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); gl.viewport(0,0,canvasW,canvasH); gl.useProgram(PRE.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,src); gl.uniform1i(PRE.U.uTex,0); gl.drawArrays(gl.TRIANGLES,0,3);
  if(!firstFrameAt && drawn>0){ firstFrameAt=performance.now(); }
}

/* ---------- main loop ---------- */
let last=performance.now(), fpsAcc=0, fpsN=0, fpsShown=0, hudT=0, shotMode=Q.get('pause')==='1';
function tick(now){
  requestAnimationFrame(tick);
  if(shotMode) return;
  const rawDt=Math.max(1e-3,(now-last)/1000); const dt=Math.min(0.05,rawDt); last=now;
  if(!(st.photo)) st.time+=dt; st.frozenTime=null;
  if(st.tour) st.tourT+=dt;
  stepPlayer(dt); poseFigure(st.photo?st.time:st.time); updateCamera(dt); makeGrass(false);
  // camera stillness → photo accumulation
  const camKey=camState.pos.concat(camState.fwd).map(v=>v.toFixed(4)).join(',');
  if(camKey===st.lastCam) st.stillT+=dt; else { st.stillT=0; st.accN=0; } st.lastCam=camKey;
  const accumulate = st.photo && st.stillT>0.5 && st.accN<32;
  if(st.photo && st.accN>=32){ /* hold the clean still */ gl.bindFramebuffer(gl.FRAMEBUFFER,null); }
  else renderFrame(accumulate);
  // dynamic resolution with hysteresis
  const fps=1/rawDt; st.fpsEMA+= (fps-st.fpsEMA)*0.08; fpsAcc+=fps; fpsN++;
  if(!st.photo && jobsDone>=jobsTotal){ if(st.fpsEMA<42){ st.lowT+=dt; st.highT=0; if(st.lowT>1.0 && st.scale>0.6){ st.scale=Math.max(0.6,st.scale-0.1); st.lowT=0; } }
    else if(st.fpsEMA>57){ st.highT+=dt; st.lowT=0; if(st.highT>2.5 && st.scale<1.0){ st.scale=Math.min(1,st.scale+0.05); st.highT=0; } } else { st.lowT=0; st.highT=0; } }
  hudT+=dt; if(hudT>0.4){ fpsShown=fpsAcc/Math.max(1,fpsN); fpsAcc=0; fpsN=0; hudT=0; updateHud(); }
}
function updateHud(){ if(!st.hud) return; const t=TIERS[st.tier];
  $('hud').textContent=`FPS ${fpsShown.toFixed(0)} · strokes ${(lastDrawn/1000).toFixed(0)}k drawn / ${((totalStrokes+grassN)/1000).toFixed(0)}k\ntier ${t.label} · ${t.bristles} bristles · res ${RT?RT.w+'×'+RT.h:'-'} (${Math.round(st.scale*100)}%)\nphysics ${st.physics} · ${st.tour?'tour':(st.auto?'auto':'manual')}${st.photo?' · photo '+st.accN+'/32':''}`;
  window.__stats={fps:fpsShown,drawn:lastDrawn,total:totalStrokes+grassN,tier:st.tier,physics:st.physics,res:RT?[RT.w,RT.h]:null,scale:st.scale,jobsDone,jobsTotal,firstFrameMs:firstFrameAt?Math.round(firstFrameAt-loadStart):null,pos:st.pos.slice(),vista:st.vista,mode:st.tour?'tour':(st.auto?'auto':'manual')}; }

/* ---------- test hooks: fixed camera presets ---------- */
function readFrame(){ const w=RT.w,h=RT.h, px=new Uint8Array(w*h*4); gl.bindFramebuffer(gl.FRAMEBUFFER,RT.res.f); gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,px); gl.bindFramebuffer(gl.FRAMEBUFFER,null); return {w,h,px}; }
function frameStats(f){ const hist=new Array(16).fill(0); let s=0,s2=0,n=0; for(let i=0;i<f.px.length;i+=16){ const l=(f.px[i]*0.2126+f.px[i+1]*0.7152+f.px[i+2]*0.0722); s+=l; s2+=l*l; n++; hist[Math.min(15,l>>4)]++; }
  const mean=s/n, sd=Math.sqrt(Math.max(0,s2/n-mean*mean)); const used=hist.filter(v=>v>n*0.002).length; return {mean:+mean.toFixed(1),sd:+sd.toFixed(1),bins:used,hist}; }
function frameDiff(a,b){ let s=0,big=0,n=0; for(let i=0;i<a.px.length;i+=4){ const d=(Math.abs(a.px[i]-b.px[i])+Math.abs(a.px[i+1]-b.px[i+1])+Math.abs(a.px[i+2]-b.px[i+2]))/3; s+=d; if(d>40) big++; n++; } return {meanAbs:+(s/n).toFixed(3),pctOver40:+(100*big/n).toFixed(3)}; }
const PRESETS={
  wide:()=>({pos:[6,12.5,-8],look:[-40,4,-420]}),
  paint:()=>{ const x=2.3,z=-19.6,y=terrainH(x,z); const n=terrainN(x,z,0.2); return {pos:[x+n[0]*1.1+0.35,y+n[1]*1.1+0.1,z+n[2]*1.1+0.5],look:[x,y,z]}; },
  hero:()=>{ const p=st.pos; return {pos:[p[0]+0.5,p[1]+1.25,p[2]+4.3],look:[p[0],p[1]+1.2,p[2]-6]}; },
  sky:()=>({pos:[0,10,-18],look:[60,330,-1000]}),
  tour:()=>{ const p=tourAt(21/80), q=tourAt(22.4/80); return {pos:p,look:V3.add(p,V3.add(V3.sc(V3.norm(V3.sub(q,p)),60),[0,-6,0]))}; },
  mobile:()=>{ const p=st.pos; return {pos:[p[0]+0.4,p[1]+1.4,p[2]+4.6],look:[p[0],p[1]+1.25,p[2]-4]}; }
};
window.__shot=function(id,opts){ opts=opts||{}; shotMode=true;
  st.auto=false; st.tour=false; st.pos=[0,terrainH(0,-21.5),-21.5]; st.yaw=Math.PI; st.gaze=2; st.speed=0; st.grounded=true; st.frozenTime=12.0; st.time=12.0;
  poseFigure(12.0);
  const pr=(PRESETS[id]||PRESETS.wide)(); let fwd=V3.norm(V3.sub(pr.look,pr.pos));
  if(opts.yawDeg){ const a=opts.yawDeg*Math.PI/180, c=Math.cos(a), s=Math.sin(a); fwd=[fwd[0]*c-fwd[2]*s,fwd[1],fwd[0]*s+fwd[2]*c]; }
  camState.pos=pr.pos; camState.fwd=fwd; grassCell=null; grassAt=-1; makeGrass(true);
  renderFrame(false); renderFrame(false);
  const f=readFrame(); window.__lastFrame=f; const s=frameStats(f); s.drawn=lastDrawn; s.res=[f.w,f.h]; updateHud(); return s; };
window.__snap=function(){ return readFrame(); };
window.__state=function(){ return {pos:st.pos.map(v=>+v.toFixed(3)),mode:st.tour?'tour':(st.auto?'auto':'manual'),joy:joyV.map(v=>+v.toFixed(3)),touchUI:isTouch,grounded:st.grounded,vista:st.vista,jumps:st.jumps||0,physics:st.physics}; };
// fixed-step gameplay simulation without rendering (headless CPU renderers are too slow for real-time play)
window.__simulate=function(sec,opts){ opts=opts||{}; if(opts.auto!==undefined) setAuto(!!opts.auto); let minY=1e9;
  for(let t=0;t<sec;t+=1/30){ stepPlayer(1/30); st.time+=1/30; minY=Math.min(minY,st.pos[1]-terrainH(st.pos[0],st.pos[2])); }
  const s=window.__state(); s.minClearance=+minY.toFixed(3); s.trailDist=+trailNearest(st.pos[0],st.pos[2])[1].toFixed(2); return s; };
// flicker metric that compensates the image shift a small camera rotation causes
window.__diffShift=function(a,b,maxS){ maxS=maxS||24; let best=null; const w=a.w,h=a.h;
  for(let sx=-maxS;sx<=maxS;sx++){ let s=0,big=0,n=0; for(let y=h*0.2|0;y<h*0.8;y+=3) for(let x=maxS;x<w-maxS;x+=3){ const i=(y*w+x)*4, j=(y*w+x+sx)*4;
      const d=(Math.abs(a.px[i]-b.px[j])+Math.abs(a.px[i+1]-b.px[j+1])+Math.abs(a.px[i+2]-b.px[j+2]))/3; s+=d; if(d>60) big++; n++; }
    const r={shift:sx,meanAbs:+(s/n).toFixed(3),pctOver60:+(100*big/n).toFixed(3)}; if(!best||r.meanAbs<best.meanAbs) best=r; }
  return best; };
window.__diff=function(a,b){ return frameDiff(a,b); };
window.__resume=function(){ shotMode=false; st.frozenTime=null; last=performance.now(); };

/* ---------- boot ---------- */
try{
  const bm=benchmark(); console.log('[wanderer] benchmark',bm.ms.toFixed?bm.ms.toFixed(2):bm.ms,'ms → tier',bm.tier);
  st.tier=bm.tier; applySize(true); startWorld(bm.tier); initRapier(); updateHud();
  requestAnimationFrame(tick);
  addEventListener('resize',()=>applySize(false));
}catch(e){ showErr('Startup failed: '+(e&&e.message||e)); }
})();
</script>
